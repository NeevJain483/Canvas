name: Deploy Backend

on:
  push:
    branches: [production]
    paths: 
        - 'apps/http-server/**'
        - 'dockerfiles/Dockerfile.backend'

jobs:
  build-and-push-backend:
    name: Build Backend (ARM64 Natively on EC2)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/Dockerfile.backend
          push: true
          platforms: linux/arm64 # Only build for your target platform
          tags: |
            neev480/canvas-backend:${{ github.sha }}
            neev480/canvas-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max