name: Deploy the backend with docker

on:
  push:
    branches: [production]

jobs:
  # --- MULTI-ARCHITECTURE BUILD MATRIX ---
  build-and-push:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # This spins up 4 jobs at the exact same time (2 apps x 2 architectures)
        include:
          # Backend Builds
          - app: backend
            file: ./dockerfiles/Dockerfile.backend
            tag: neev480/canvas-backend
            platform: linux/amd64
            runner: ubuntu-latest  # Built natively on GitHub's free x86 runner
          - app: backend
            file: ./dockerfiles/Dockerfile.backend
            tag: neev480/canvas-backend
            platform: linux/arm64
            runner: [self-hosted, arm64] # Built natively on your fast AWS T4g EC2

          # Frontend Builds
          - app: frontend
            file: ./dockerfiles/Dockerfile.frontend
            tag: neev480/canvas-frontend
            platform: linux/amd64
            runner: ubuntu-latest  # Built natively on GitHub's free x86 runner
          - app: frontend
            file: ./dockerfiles/Dockerfile.frontend
            tag: neev480/canvas-frontend
            platform: linux/arm64
            runner: [self-hosted, arm64] # Built natively on your fast AWS T4g EC2

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      # Notice: NO MORE QEMU! Emulation is no longer required.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ matrix.tag }}:${{ github.sha }}-${{ matrix.app == 'backend' && 'amd64' || 'arm64' }}
            ${{ matrix.tag }}:latest-${{ matrix.app == 'backend' && 'amd64' || 'arm64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max