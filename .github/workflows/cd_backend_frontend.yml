name: Deploy the backend with docker

on:
  push:
    branches: [production]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/Dockerfile.backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            neev480/canvas-backend:${{ github.sha }}
            neev480/canvas-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/Dockerfile.frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            neev480/canvas-frontend:${{ github.sha }}
            neev480/canvas-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max