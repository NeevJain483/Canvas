name: Deploy the backend with docker
on:
  push:
    branches: [production]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2
      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_TOKEN}}
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfiles/Dockerfile.backend
          push: true
          tags: |
            neev480/canvas-backend:${{github.sha}}
            neev480/canvas-backend:latest
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfiles/Dockerfile.frontend
          push: true
          tags: |
            neev482/canvas-frontend:${{github.sha}}
            neev482/canvas-frontend:latest