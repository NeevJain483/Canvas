name: Deploy Frontend

on:
  push:
    branches: [production]
    # paths: 
    #     - 'apps/web/**'
    #     - 'dockerfiles/Dockerfile.backend'

jobs:
  build-and-push-frontend:
    name: Build Frontend (ARM64 Natively on EC2)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/Dockerfile.frontend
          push: true
          platforms: linux/arm64 # Only build for your target platform
          tags: |
            neev480/canvas-frontend:${{ github.sha }}
            neev480/canvas-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max